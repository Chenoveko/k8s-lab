apiVersion: v1
kind: Pod
metadata:
  labels:
  name: nginx-storage
spec:
  containers:
    - image: nginx
      name: nginx
      volumeMounts:
        - mountPath: /scratch # Mounts shared volume at /scratch
          name: scratch-volume
    - image: busybox
      name: busybox
      command: ["/bin/sh","-c"]
      args: ["sleep 1000"] # Keeps container running
      volumeMounts:
        - mountPath: /scratch # Same volume mounted, allows file sharing between containers
          name: scratch-volume
  volumes:
    # Ephemeral volume shared between both containers
    - name: scratch-volume
      emptyDir:
        sizeLimit: 500Mi # 500 MB limit